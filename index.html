<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="English–Armenian medical dictionary with phrasebook, word parts, abbreviations and a spaced-repetition trainer.">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English–Հայերեն Medical Dictionary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2fbfa;--surface:#fff;--text:#0f2a2e;--muted:#5b7a7e;--accent:#0d9488;--accent2:#06b6d4;--heart:#e11d48;--border:#d3ebe8;--mark:#fde68a;--blob1:#5eead4;--blob2:#a5f3fc;--shadow:0 10px 30px rgba(13,110,120,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#071518;--surface:#0e2428;--text:#e8f7f6;--muted:#8fb0b3;--accent:#2dd4bf;--accent2:#22d3ee;--border:#1c3b40;--mark:#7c5e03;--blob1:#0f766e;--blob2:#155e75;--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#071518;--surface:#0e2428;--text:#e8f7f6;--muted:#8fb0b3;--accent:#2dd4bf;--accent2:#22d3ee;--border:#1c3b40;--mark:#7c5e03;--blob1:#0f766e;--blob2:#155e75;--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans Armenian",system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
canvas{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:90}
/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#0b5a60,#062a2e 60%,#031417);color:#fff;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);transition:transform .95s cubic-bezier(.76,0,.24,1);cursor:pointer}
#intro.out{transform:translateY(-101%)}
.in-wrap{width:100%;max-width:560px}
.cross{width:64px;height:64px;margin:0 auto 18px;position:relative;animation:beat 1.1s ease-in-out infinite}
.cross::before,.cross::after{content:"";position:absolute;background:var(--heart);border-radius:6px;box-shadow:0 0 28px rgba(244,63,94,.7)}
.cross::before{left:23px;top:0;width:18px;height:64px}.cross::after{top:23px;left:0;height:18px;width:64px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.ecg{width:100%;height:96px;display:block}
.ecg path{fill:none;stroke:#5eead4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1300;stroke-dashoffset:1300;filter:drop-shadow(0 0 6px #2dd4bf);animation:draw 2s .3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.t1,.t2,.num,.skip{opacity:0;transform:translateY(16px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.t1{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#99f6e4;animation-delay:.5s;margin-top:6px}
.t2{font-weight:800;font-size:clamp(30px,8.5vw,52px);line-height:1.15;margin:10px 0 0;animation-delay:1s;background:linear-gradient(90deg,#fff,#5eead4,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.num{margin-top:18px;font-size:15px;color:#a7d9d6;animation-delay:1.5s}.num b{font-size:30px;color:#fff;margin-right:6px}
.skip{margin-top:26px;font-size:12px;color:#6fb3ae;animation-delay:2s}
@keyframes up{to{opacity:1;transform:none}}
/* layout */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0;pointer-events:none}
.b1{width:340px;height:340px;background:var(--blob1);top:-80px;left:-80px;animation:f1 14s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-60px;right:-60px;animation:f2 18s ease-in-out infinite}
@keyframes f1{50%{transform:translate(60px,80px) scale(1.15)}}@keyframes f2{50%{transform:translate(-70px,-60px) scale(1.2)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 16px 64px;opacity:0}
main.show{opacity:1}main.show>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
header{text-align:center;margin-bottom:18px}
h1{margin:0;font-weight:800;font-size:clamp(28px,7.5vw,42px);line-height:1.15;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:5px;margin:0 0 14px;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px}
#tabs button,.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.25s}
#tabs button.on,.seg button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.seg{display:flex;gap:4px;margin-bottom:14px}.seg button{border:1px solid var(--border);background:var(--surface)}
.search{position:relative}
.search input{width:100%;padding:17px 18px 17px 52px;font-size:18px;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:18px;box-shadow:var(--shadow);outline:none;font-family:inherit;transition:.25s}
.search input:focus{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.search svg{position:absolute;left:17px;top:50%;width:22px;height:22px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;transition:.25s}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.count{margin:10px 4px 2px;font-size:13px;color:var(--muted);min-height:18px}
.grid{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .2s,border-color .25s}
.card:hover{--ty:-3px;border-color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.en{font-size:17px;font-weight:600}.hy{font-size:20px;margin-top:4px;color:var(--accent)}
.cat{font-size:11px;color:var(--muted)}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.grid>*{min-width:0}.en,.hy{overflow-wrap:anywhere}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.acts button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:5px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.heart.on{color:var(--heart);border-color:var(--heart)}.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;list-style:none}
.more{display:block;margin:20px auto 0;padding:12px 26px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:15px;font-family:inherit;cursor:pointer}
.wod,.qcard{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:22px 20px;text-align:center;box-shadow:var(--shadow);margin-top:14px;position:relative;overflow:hidden}
.wod::after,.qcard::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 4s 1s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.wod small,.qcard small{opacity:.85;font-size:12px;letter-spacing:.08em}
.qw{font-size:clamp(24px,7vw,36px);font-weight:700;margin-top:6px}
.wod .acts{justify-content:center;margin-top:10px}.wod .acts button{color:#fff;border-color:#fff9}
.bodywrap{display:grid;gap:16px;justify-items:center}
@media(min-width:620px){.bodywrap{grid-template-columns:200px 1fr;align-items:start;justify-items:stretch}}
#body{width:180px;justify-self:center;overflow:visible}
.z{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:1.5;cursor:pointer;transition:.25s}
.z:hover{fill:color-mix(in srgb,var(--accent) 40%,transparent)}
.z.sel{fill:var(--accent);animation:glow 1.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--accent2))}}
.scan{fill:var(--accent2);opacity:.6;pointer-events:none;animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(440px)}}
.det{fill:var(--accent);stroke:var(--accent);stroke-width:1.3;stroke-linecap:round;opacity:.55;pointer-events:none}#body .z{stroke-linejoin:round}#bodyhd{margin:0;font-size:16px;color:var(--muted)}
.stats{display:flex;justify-content:space-between;font-weight:600}.stats span{color:var(--muted);font-weight:400}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;font-family:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.good{background:#16a34a!important;color:#fff!important;border-color:#16a34a!important}
.bad{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important;animation:shake .4s}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
.flip{perspective:900px;height:210px;cursor:pointer;position:relative;margin-top:14px}
.face{position:absolute;inset:0;display:grid;place-content:center;text-align:center;border-radius:22px;backface-visibility:hidden;transition:transform .6s;box-shadow:var(--shadow);padding:10px}
.f1{background:var(--surface);border:1px solid var(--border)}.f1 small{color:var(--muted)}
.f2{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transform:rotateY(180deg)}
.flip.on .f1{transform:rotateY(-180deg)}.flip.on .f2{transform:rotateY(0)}
.cen{display:flex;justify-content:center;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:120;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
footer{text-align:center;margin-top:34px;color:var(--muted);font-size:12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* --- additions --- */
header{position:relative;padding-top:26px}
#theme{position:absolute;top:-8px;right:0;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;line-height:1;box-shadow:var(--shadow)}
#tabs button{font-size:13px;padding:10px 2px}
.hyv{display:none!important}body.hasHy .hyv{display:inline-block!important}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.tools button,.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;transition:.2s}
.tools button:hover,.btn:hover{border-color:var(--accent)}
#lcat{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit;margin-bottom:12px}
.lst{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.lst b{color:var(--text)}.lst .r{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.typein{width:100%;padding:16px;font-size:20px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;outline:none;margin-top:14px}
.typein:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .opt{font-size:16px;padding:14px}
.play{display:block;margin:0 auto;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:14px 26px;font-size:20px;font-family:inherit;cursor:pointer;margin-top:10px}
.fb{margin-top:12px;text-align:center;font-size:15px;min-height:22px}
.grid.wide{grid-template-columns:1fr}
.abbr{font-size:22px;font-weight:800;color:var(--accent);overflow-wrap:anywhere}
.ex{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.note{margin:12px 2px 0;padding:10px 14px;border-radius:14px;border:1px dashed var(--accent);color:var(--muted);font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,.z:focus-visible,.flip:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.z:focus-visible{outline:none;stroke-width:3.5}
@media (max-width:380px){.two{grid-template-columns:1fr}}
</style>
</head>
<body class="lock">
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<div id="intro"><div class="in-wrap"><div class="cross"></div>
<svg class="ecg" viewBox="0 0 600 100" preserveAspectRatio="none"><path d="M0 50 H150 L168 50 L186 22 L206 84 L228 6 L248 50 H300 L316 40 L332 50 H600"/></svg>
<div class="t1">English → Հայերեն</div><h2 class="t2">Բժշկական բառարան</h2>
<div class="num"><b id="n">0</b>words and phrases</div><div class="skip">Tap to skip</div></div></div>
<div class="blob b1"></div><div class="blob b2"></div>
<main id="main">
<header><button id="theme" type="button" aria-label="Switch light/dark theme">🌙</button><h1 lang="hy">Բժշկական բառարան</h1><p class="sub">English–Armenian medical dictionary</p></header>
<nav id="tabs" role="tablist"><button role="tab" data-v="dict" class="on" aria-selected="true">Dictionary</button><button role="tab" data-v="body" aria-selected="false">Body</button><button role="tab" data-v="learn" aria-selected="false">Learn</button><button role="tab" data-v="ref" aria-selected="false">Phrases</button><button role="tab" data-v="saved" aria-selected="false">♥ Saved</button></nav>
<section class="view" id="v-dict">
<div class="search"><input id="q" type="search" placeholder="Search: heart, fever, գլուխ…" autocomplete="off"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
<div class="chips" id="chips"></div><div class="wod" id="wod"></div><div class="count" id="count"></div>
<ul class="grid" id="list"></ul><button class="more" id="more" hidden>Show more</button></section>
<section class="view" id="v-body" hidden><div class="bodywrap"><svg id="body" viewBox="0 0 200 440"></svg><div><h3 id="bodyhd">Tap a body part</h3><ul class="grid" id="bodylist"></ul></div></div></section>
<section class="view" id="v-learn" hidden><div class="seg" id="lmode"><button data-m="quiz" class="on">Quiz</button><button data-m="cards">Cards</button><button data-m="listen">Listen</button><button data-m="type">Type</button><button id="dirb">EN → ՀՅ</button></div>
<select id="lcat" aria-label="Choose what to practise"></select><div class="lst" id="lstats"></div><div id="learn"></div></section>
<section class="view" id="v-ref" hidden>
<div class="seg" id="rmode"><button data-r="ph" class="on">Phrases</button><button data-r="wp">Word parts</button><button data-r="ab">Abbreviations</button></div>
<div class="search"><input id="rq" type="search" placeholder="Search phrases…" autocomplete="off"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
<div class="chips" id="rchips"></div><div class="count" id="rcount"></div>
<ul class="grid wide" id="rlist"></ul><div class="note" id="rnote" hidden></div></section>
<section class="view" id="v-saved" hidden>
<div class="tools"><button id="exAnki" type="button">⬇ Saved for Anki</button><button id="exJson" type="button">⬇ Backup</button><button id="imJson" type="button">⬆ Restore</button><button id="exAll" type="button">⬇ All words (.txt)</button></div>
<input type="file" id="imFile" accept=".json,application/json" hidden>
<ul class="grid" id="savedlist"></ul></section>
<footer>A study dictionary, not a source of medical advice.<br>Some terms may have other professional equivalents.</footer>
</main>

const SS="speechSynthesis" in window;
const voices=()=>SS?speechSynthesis.getVoices():[];
function voiceFor(l){
 const L=l.toLowerCase(),v=voices().filter(x=>{const xl=x.lang.replace("_","-").toLowerCase();return xl===L||(L.startsWith("hy")&&xl.startsWith("hy"))});
 const pref=l==="en-GB"?/daniel|serena|kate|oliver/i:/samantha|ava|allison|nicky/i;
 return v.find(x=>/google/i.test(x.name))||v.find(x=>/premium|enhanced|neural|natural/i.test(x.name))||v.find(x=>pref.test(x.name))||v[0]}
function say(t,l){
 if(!SS)return toast("Speech is not supported here");
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),v=voiceFor(l);u.lang=l;if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u)}
const checkHy=()=>document.body.classList.toggle("hasHy",voices().some(x=>x.lang.toLowerCase().startsWith("hy")));
if(SS){checkHy();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",checkHy)}

const norm=s=>s.toLowerCase().trim();
function score(w,q,toks){
 let b=0;
 for(const f of[w.en,w.hy]){const n=norm(f),i=n.indexOf(q);if(i<0)continue;b=Math.max(b,n===q?4:i===0?3:n[i-1]===" "?2:1)}
 if(!b&&toks.length>1){const e=norm(w.en),h=norm(w.hy);if(toks.every(t=>e.includes(t)||h.includes(t)))b=1}
 return b}

const fx=$("#fx"),cx=fx.getContext("2d");let P=[],run1=0;
function boom(el){if(RM)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 for(let i=0;i<45;i++)P.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*10-2,s:4+Math.random()*5,c:`hsl(${Math.random()*360},85%,60%)`,l:75});
 if(run1)return;run1=1;(function f(){cx.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l-->0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(p.x,p.y,p.s,p.s)});
  P.length?requestAnimationFrame(f):(run1=0,cx.clearRect(0,0,fx.width,fx.height))})()}

let mode="quiz",dir=0,lcat=-1,streak=0,best=+ls.get("best")||0,lastId=-1,tok=0;
let srs={},st={day:"",n:0,streak:0,last:""};
try{srs=JSON.parse(ls.get("srs")||"{}")}catch(e){}
try{Object.assign(st,JSON.parse(ls.get("st")||"{}"))}catch(e){}
const GOAL=20,INT=[0,1,2,4,8,16];            /* Leitner boxes: days until the word is due again */
const dayStr=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const yest=()=>dayStr(new Date(Date.now()-864e5));
const curStreak=()=>st.last===dayStr()||st.last===yest()?st.streak:0;
const isHard=w=>{const s=srs[w.id];return !!s&&s.w>=2&&s.b<=2};

function rec(id,ok){
 const s=srs[id]||{b:0,w:0};
 if(ok)s.b=Math.min(s.b+1,5);else{s.b=0;s.w=(s.w||0)+1}
 s.d=Date.now()+INT[s.b]*864e5;srs[id]=s;ls.set("srs",JSON.stringify(srs));
 const t=dayStr();
 if(st.day!==t){st.day=t;st.n=0}
 st.n++;
 if(st.last!==t){st.streak=st.last===yest()?st.streak+1:1;st.last=t}
 ls.set("st",JSON.stringify(st));
 if(ok&&st.n===GOAL)toast("🎯 Daily goal reached!")}
function learnPool(){return lcat==="hard"?WORDS.filter(isHard):lcat===-1?WORDS:WORDS.filter(w=>w.c===lcat)}
function pickWord(){
 const pool=learnPool();if(!pool.length)return null;
 const now=Date.now(),other=w=>w.id!==lastId;
 const due=pool.filter(w=>srs[w.id]&&srs[w.id].d<=now&&other(w)),fresh=pool.filter(w=>!srs[w.id]&&other(w));
 let list;
 if(due.length&&(!fresh.length||Math.random()<.6))list=due;
 else if(fresh.length)list=fresh;
 else{const m=Math.min(...pool.map(w=>srs[w.id].b));list=pool.filter(w=>srs[w.id].b===m&&other(w))}
 return rnd(list.length?list:pool)}
function stats(){
 const pool=learnPool(),now=Date.now(),today=st.day===dayStr()?st.n:0;
 const learned=pool.filter(w=>srs[w.id]&&srs[w.id].b>=3).length,due=pool.filter(w=>srs[w.id]&&srs[w.id].d<=now).length;
 $("#lstats").innerHTML=`<div class="r"><span>Today <b>${today}/${GOAL}</b></span><span>Day streak <b>${curStreak()}</b></span><span>Learned <b>${learned}/${pool.length}</b></span><span>Due <b>${due}</b></span></div><div class="bar"><i style="width:${Math.min(100,today/GOAL*100)}%"></i></div>`;
 const o=$('#lcat option[value="hard"]');if(o)o.textContent="Hard words ("+WORDS.filter(isHard).length+")"}
function fillCats(){
 const sel=$("#lcat");
 sel.innerHTML='<option value="-1">All categories</option>'+CATS.map((c,i)=>`<option value="${i}">${esc(c[0])}</option>`).join("")+'<option value="hard">Hard words</option>';

/* distractors never repeat the correct text or a synonym with the same Armenian */
function options(w,field){
 const o=[w],seen=new Set([w[field]]);
 const add=list=>{list=shuffle(list.slice());for(const x of list){if(o.length>=4)break;if(seen.has(x[field]))continue;seen.add(x[field]);o.push(x)}};
 const ok=x=>x.id!==w.id&&x.hy!==w.hy&&x.en!==w.en;
 add(WORDS.filter(x=>x.c===w.c&&ok(x)));
 if(o.length<4)add(WORDS.filter(ok));
 return shuffle(o)}
const empty=()=>{$("#learn").innerHTML='<div class="qcard"><small>NOTHING HERE YET</small><div class="qw" style="font-size:20px">No hard words yet — keep practising and the tricky ones will show up here.</div></div>'};
function pickOpt(w,b,my){
 const ok=+b.dataset.o===w.id;
 $$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===w.id)x.classList.add("good")});
 if(ok){streak++;if(streak>best){best=streak;ls.set("best",best)}boom(b)}else{b.classList.add("bad");streak=0}
 const h=$("#lh");if(h)h.textContent=w.en;
 rec(w.id,ok);stats();
 setTimeout(()=>{if(my===tok&&view==="learn")learn()},ok?900:1700)}
function optsHtml(o,k,hy){return `<div class="opts">${o.map(x=>`<button class="opt" data-o="${x.id}" ${hy?'lang="hy"':''}>${esc(x[k])}</button>`).join("")}</div>`}

function quiz(){

 $$(".opt").forEach(b=>b.onclick=()=>pickOpt(w,b,my))}

 $$(".opt").forEach(b=>b.onclick=()=>pickOpt(w,b,my))}
function cards(){
 const w=pickWord();if(!w)return empty();lastId=w.id;++tok;
 $("#learn").innerHTML=`<div class="flip" id="fl" tabindex="0" role="button" aria-label="Flip card"><div class="face f1"><div class="qw" ${dir?'lang="hy"':''}>${esc(dir?w.hy:w.en)}</div><small>Tap to flip</small></div><div class="face f2"><div class="qw" ${dir?'':'lang="hy"'}>${esc(dir?w.en:w.hy)}</div></div></div><div class="cen"><div class="acts">${acts(w)}</div></div><div class="two"><button class="opt" id="no" type="button">✗ Again</button><button class="opt" id="yes" type="button">✓ Got it</button></div>`;
 const fl=$("#fl"),flip=()=>fl.classList.toggle("on");fl.onclick=flip;fl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};

const nz=s=>s.toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z0-9' \-]/g,"").replace(/\s+/g," ").trim();
function typing(){
 const w=pickWord();if(!w)return empty();lastId=w.id;
 const my=++tok,okSet=new Set(WORDS.filter(x=>x.hy===w.hy).map(x=>nz(x.en)));
 $("#learn").innerHTML=`<div class="stats"><div>🔥 In a row: ${streak}</div><span>Best: ${best}</span></div><div class="qcard"><small>TYPE THE ENGLISH WORD</small><div class="qw" lang="hy">${esc(w.hy)}</div></div><form id="tf" autocomplete="off"><input class="typein" id="ti" aria-label="English word" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="English…"><div class="two"><button type="button" class="opt" id="hint">💡 Hint</button><button class="opt" id="chk" type="submit">Check</button></div></form><div class="fb" id="fb"></div>`;
 const ti=$("#ti"),fb=$("#fb");let done=false;
 setTimeout(()=>{try{ti.focus({preventScroll:true})}catch(e){}},50);
 $("#hint").onclick=()=>{fb.textContent=w.en[0]+w.en.slice(1).replace(/[A-Za-z0-9]/g,"•");ti.focus()};
 $("#tf").onsubmit=e=>{
  e.preventDefault();
  if(done){learn();return}
  const v=nz(ti.value);if(!v)return;
  const good=okSet.has(v);done=true;ti.disabled=true;ti.classList.add(good?"good":"bad");
  fb.innerHTML=good?"✓ "+esc(w.en):"Answer: <b>"+esc(w.en)+"</b>";
  if(good){streak++;if(streak>best){best=streak;ls.set("best",best)}boom(ti)}else streak=0;
  rec(w.id,good);stats();$("#chk").textContent="Next ➜";$("#chk").focus();
  if(good)setTimeout(()=>{if(my===tok&&view==="learn"&&done)learn()},1100)}}

 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
const ankiText=list=>"#separator:tab\n#html:false\n"+list.map(w=>w.en+"\t"+w.hy).join("\n")+"\n";
$("#exAnki").onclick=()=>{const r=WORDS.filter(w=>fav.has(w.id));if(!r.length)return toast("Nothing saved yet");download("medical-dictionary-saved.txt",ankiText(r),"text/plain");toast(r.length+" words exported")};
$("#exAll").onclick=()=>{download("medical-dictionary-all.txt",ankiText(WORDS),"text/plain");toast(WORDS.length+" words exported")};
$("#exJson").onclick=()=>{
 const key=id=>BY[id].en+"|"+BY[id].hy,s={};
 Object.keys(srs).forEach(id=>{if(BY[id])s[key(id)]=srs[id]});
 download("medical-dictionary-backup.json",JSON.stringify({v:1,saved:[...fav].map(key),srs:s,best,st},null,1),"application/json");toast("Backup saved")};
$("#imJson").onclick=()=>$("#imFile").click();
$("#imFile").onchange=e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 f.text().then(t=>{
  const d=JSON.parse(t);if(!d||d.v!==1)throw 0;let a=0,b=0;
  (d.saved||[]).forEach(k=>{const id=KEYMAP.get(k);if(id!==undefined&&!fav.has(id)){fav.add(id);a++}});
  Object.keys(d.srs||{}).forEach(k=>{const id=KEYMAP.get(k),s=d.srs[k];if(id===undefined||!s)return;const c=srs[id];if(!c||(s.b||0)>c.b){srs[id]={b:s.b|0,w:s.w|0,d:+s.d||0};b++}});
  if(d.best>best){best=d.best;ls.set("best",best)}
  saveFav();ls.set("srs",JSON.stringify(srs));renderSaved();toast("Restored: "+a+" saved, "+b+" progress entries")
 }).catch(()=>toast("That file is not a valid backup"))};

/* ---------- tabs ---------- */
function go(v){
 view=v;$$(".view").forEach(x=>x.hidden=x.id!=="v-"+v);
 $$("#tabs button").forEach(b=>{const on=b.dataset.v===v;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
 if(v!=="learn"){tok++;SS&&speechSynthesis.cancel()}
 if(v==="saved")renderSaved();
 if(v==="learn"){fillCats();learn()}
 if(v==="ref")rInit();
 if(v==="body"&&!$(".z.sel"))pick("head");
 scrollTo({top:0})}
$("#tabs").onclick=e=>{const b=e.target.closest("button");b&&go(b.dataset.v)};
$("#tabs").onkeydown=e=>{
 if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
 const bs=$$("#tabs button"),i=bs.findIndex(x=>x.classList.contains("on")),n=bs[(i+(e.key==="ArrowRight"?1:bs.length-1))%bs.length];n.focus();go(n.dataset.v)};
$("#dirb").hidden=false;

/* deep link: #q=word */
function fromHash(){
 const m=location.hash.match(/^#q=(.*)$/);if(!m)return;
 try{$("#q").value=decodeURIComponent(m[1])}catch(e){return}
 cat=-1;$$("#chips .chip").forEach((x,i)=>x.classList.toggle("on",i===0));go("dict");render(true)}
addEventListener("hashchange",fromHash);

/* ---------- background: cells + DNA helix ---------- */
const bg=$("#bg"),bx=bg.getContext("2d");let W,H,col="#0d9488",t=0,fr=0;
const cells=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),r:8+Math.random()*24,v:.0024*(.5+Math.random())}));
function size(){W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight;col=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||col}
function tick(){
 if(fr++%120===0)col=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||col;
 bx.clearRect(0,0,W,H);bx.strokeStyle=bx.fillStyle=col;bx.lineWidth=2;bx.globalAlpha=.16;
 cells.forEach(c=>{if(!RM)c.y-=c.v/60;if(c.y<-.1)c.y=1.1;bx.beginPath();bx.arc(c.x*W,c.y*H,c.r,0,7);bx.stroke()});
 const x0=W-30;bx.globalAlpha=.3;
 for(let y=0;y<H;y+=12){const s=Math.sin(y/40+t),a=x0+s*20,b=x0-s*20;
  bx.beginPath();bx.arc(a,y,2.6,0,7);bx.fill();bx.beginPath();bx.arc(b,y,2.6,0,7);bx.fill();
  if(y%36===0){bx.lineWidth=1;bx.beginPath();bx.moveTo(a,y);bx.lineTo(b,y);bx.stroke()}}
 t+=.02;if(!RM)requestAnimationFrame(tick)}
size();tick();addEventListener("resize",()=>{size();RM&&tick()});

/* ---------- intro ---------- */
const intro=$("#intro");let done=false;
function finish(){if(done)return;done=true;intro.classList.add("out");$("#main").classList.add("show");document.body.classList.remove("lock");setTimeout(()=>intro.remove(),1100)}
intro.onclick=finish;setTimeout(finish,3800);
(function(){const T=WORDS.length+PHF.length+WP.length+AB.length,t0=performance.now(),el=$("#n");
 (function s(now){const p=Math.min((now-t0-600)/1700,1);el.textContent=p<1?Math.round(T*(p<0?0:1-Math.pow(1-p,3))):T;if(p<1&&!done)requestAnimationFrame(s);else el.textContent=T})(t0)})();

/* ---------- offline ---------- */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
fromHash();
</script>
