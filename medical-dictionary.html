<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English–Հայերեն Medical Dictionary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2fbfa;--surface:#fff;--text:#0f2a2e;--muted:#5b7a7e;--accent:#0d9488;--accent2:#06b6d4;--heart:#e11d48;--border:#d3ebe8;--mark:#fde68a;--blob1:#5eead4;--blob2:#a5f3fc;--shadow:0 10px 30px rgba(13,110,120,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#071518;--surface:#0e2428;--text:#e8f7f6;--muted:#8fb0b3;--accent:#2dd4bf;--accent2:#22d3ee;--border:#1c3b40;--mark:#7c5e03;--blob1:#0f766e;--blob2:#155e75;--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#071518;--surface:#0e2428;--text:#e8f7f6;--muted:#8fb0b3;--accent:#2dd4bf;--accent2:#22d3ee;--border:#1c3b40;--mark:#7c5e03;--blob1:#0f766e;--blob2:#155e75;--shadow:0 10px 30px rgba(0,0,0,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans Armenian",system-ui,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
canvas{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0}#fx{z-index:90}
/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#0b5a60,#062a2e 60%,#031417);color:#fff;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);transition:transform .95s cubic-bezier(.76,0,.24,1);cursor:pointer}
#intro.out{transform:translateY(-101%)}
.in-wrap{width:100%;max-width:560px}
.cross{width:64px;height:64px;margin:0 auto 18px;position:relative;animation:beat 1.1s ease-in-out infinite}
.cross::before,.cross::after{content:"";position:absolute;background:var(--heart);border-radius:6px;box-shadow:0 0 28px rgba(244,63,94,.7)}
.cross::before{left:23px;top:0;width:18px;height:64px}.cross::after{top:23px;left:0;height:18px;width:64px}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.ecg{width:100%;height:96px;display:block}
.ecg path{fill:none;stroke:#5eead4;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1300;stroke-dashoffset:1300;filter:drop-shadow(0 0 6px #2dd4bf);animation:draw 2s .3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.t1,.t2,.num,.skip{opacity:0;transform:translateY(16px);animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
.t1{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#99f6e4;animation-delay:.5s;margin-top:6px}
.t2{font-weight:800;font-size:clamp(30px,8.5vw,52px);line-height:1.15;margin:10px 0 0;animation-delay:1s;background:linear-gradient(90deg,#fff,#5eead4,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.num{margin-top:18px;font-size:15px;color:#a7d9d6;animation-delay:1.5s}.num b{font-size:30px;color:#fff;margin-right:6px}
.skip{margin-top:26px;font-size:12px;color:#6fb3ae;animation-delay:2s}
@keyframes up{to{opacity:1;transform:none}}
/* layout */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0;pointer-events:none}
.b1{width:340px;height:340px;background:var(--blob1);top:-80px;left:-80px;animation:f1 14s ease-in-out infinite}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-60px;right:-60px;animation:f2 18s ease-in-out infinite}
@keyframes f1{50%{transform:translate(60px,80px) scale(1.15)}}@keyframes f2{50%{transform:translate(-70px,-60px) scale(1.2)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 16px 64px;opacity:0}
main.show{opacity:1}main.show>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
header{text-align:center;margin-bottom:18px}
h1{margin:0;font-weight:800;font-size:clamp(28px,7.5vw,42px);line-height:1.15;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:5px;margin:0 0 14px;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px}
#tabs button,.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.25s}
#tabs button.on,.seg button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.seg{display:flex;gap:4px;margin-bottom:14px}.seg button{border:1px solid var(--border);background:var(--surface)}
.search{position:relative}
.search input{width:100%;padding:17px 18px 17px 52px;font-size:18px;color:var(--text);background:var(--surface);border:2px solid var(--border);border-radius:18px;box-shadow:var(--shadow);outline:none;font-family:inherit;transition:.25s}
.search input:focus{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow)}
.search svg{position:absolute;left:17px;top:50%;width:22px;height:22px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;transition:.25s}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.count{margin:10px 4px 2px;font-size:13px;color:var(--muted);min-height:18px}
.grid{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0));transition:transform .2s,border-color .25s}
.card:hover{--ty:-3px;border-color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.en{font-size:17px;font-weight:600}.hy{font-size:20px;margin-top:4px;color:var(--accent)}
.cat{font-size:11px;color:var(--muted);margin-top:8px}
.acts{display:flex;gap:4px;flex:none}
.acts button{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:5px 8px;font-size:12px;cursor:pointer;font-family:inherit}
.heart.on{color:var(--heart);border-color:var(--heart)}.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;list-style:none}
.more{display:block;margin:20px auto 0;padding:12px 26px;border-radius:999px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-size:15px;font-family:inherit;cursor:pointer}
.wod,.qcard{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:22px;padding:22px 20px;text-align:center;box-shadow:var(--shadow);margin-top:14px;position:relative;overflow:hidden}
.wod::after,.qcard::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 4s 1s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.wod small,.qcard small{opacity:.85;font-size:12px;letter-spacing:.08em}
.qw{font-size:clamp(24px,7vw,36px);font-weight:700;margin-top:6px}
.wod .acts{justify-content:center;margin-top:10px}.wod .acts button{color:#fff;border-color:#fff9}
.bodywrap{display:grid;gap:16px;justify-items:center}
@media(min-width:620px){.bodywrap{grid-template-columns:200px 1fr;align-items:start;justify-items:stretch}}
#body{width:170px;justify-self:center;overflow:visible}
.z{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:1.5;cursor:pointer;transition:.25s}
.z:hover{fill:color-mix(in srgb,var(--accent) 40%,transparent)}
.z.sel{fill:var(--accent);animation:glow 1.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px var(--accent2))}}
.scan{fill:var(--accent2);opacity:.6;pointer-events:none;animation:scan 4s linear infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(420px)}}
#bodyhd{margin:0;font-size:16px;color:var(--muted)}
.stats{display:flex;justify-content:space-between;font-weight:600}.stats span{color:var(--muted);font-weight:400}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{padding:16px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-size:18px;font-family:inherit;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.good{background:#16a34a!important;color:#fff!important;border-color:#16a34a!important}
.bad{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important;animation:shake .4s}
@keyframes shake{25%{translate:-8px}75%{translate:8px}}
.flip{perspective:900px;height:210px;cursor:pointer;position:relative;margin-top:14px}
.face{position:absolute;inset:0;display:grid;place-content:center;text-align:center;border-radius:22px;backface-visibility:hidden;transition:transform .6s;box-shadow:var(--shadow);padding:10px}
.f1{background:var(--surface);border:1px solid var(--border)}.f1 small{color:var(--muted)}
.f2{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transform:rotateY(180deg)}
.flip.on .f1{transform:rotateY(-180deg)}.flip.on .f2{transform:rotateY(0)}
.cen{display:flex;justify-content:center;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:120;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
footer{text-align:center;margin-top:34px;color:var(--muted);font-size:12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

/* body map */
const Z=[
{id:"head",n:"Head & face",s:[["e",100,40,27,31]],k:["head","face","eye","ear","nose","mouth","lip","tooth","teeth","tongue","cheek","chin","jaw","forehead","hair","brain","skull","eyebrow","eyelid","throat"]},
{id:"neck",n:"Neck",s:[["r",90,70,20,20,7]],k:["neck","throat","thyroid","spine"]},
{id:"chest",n:"Chest",s:[["r",64,92,72,58,18]],k:["chest","heart","lung","rib","breast","sternum","collarbone","shoulder","pulse","cough"]},
{id:"belly",n:"Abdomen",s:[["r",68,152,64,54,14]],k:["abdomen","stomach","liver","intestine","kidney","bladder","waist","navel","appendix","pancreas","gallbladder","digest"]},
{id:"arms",n:"Arms",s:[["r",34,96,24,106,12,1]],k:["arm","elbow","forearm","shoulder","wrist","muscle","bicep"]},
{id:"hands",n:"Hands",s:[["e",44,222,14,20,1]],k:["hand","palm","finger","thumb","fingernail","wrist","nail"]},
{id:"legs",n:"Hips & thighs",s:[["r",66,210,32,92,15,1]],k:["hip","thigh","leg","buttock","bone","femur"]},
{id:"knees",n:"Knees & shins",s:[["r",70,306,26,76,12,1]],k:["knee","shin","calf","leg","joint"]},
{id:"feet",n:"Feet",s:[["e",80,398,22,11,1]],k:["foot","feet","toe","ankle","heel"]}];
const shp=(a,m)=>a[0]==="e"?`<ellipse cx="${m?200-a[1]:a[1]}" cy="${a[2]}" rx="${a[3]}" ry="${a[4]}"/>`:`<rect x="${m?200-a[1]-a[3]:a[1]}" y="${a[2]}" width="${a[3]}" height="${a[4]}" rx="${a[5]}"/>`;
$("#body").innerHTML=Z.map(z=>`<g class="z" data-z="${z.id}"><title>${z.n}</title>${z.s.map(a=>shp(a,0)+(a[a.length-1]===1?shp(a,1):"")).join("")}</g>`).join("")+'<rect class="scan" x="14" y="0" width="172" height="3" rx="2"/>';
function pick(id){
 const z=Z.find(z=>z.id===id);$$(".z").forEach(g=>g.classList.toggle("sel",g.dataset.z===id));
 const re=new RegExp("\\b("+z.k.join("|")+")s?\\b","i");
 const r=WORDS.filter(w=>re.test(w.en)).sort((a,b)=>a.en.length-b.en.length).slice(0,16);
 $("#bodyhd").textContent=z.n+" · "+r.length+" words";
 $("#bodylist").innerHTML=r.map((w,i)=>card(w,"",i)).join("")||'<li class="empty">No words here yet.</li>'}
$("#body").onclick=e=>{const g=e.target.closest(".z");g&&pick(g.dataset.z)};
/* learn */
const fx=$("#fx"),cx=fx.getContext("2d");let P=[],run1=0;
function boom(el){if(RM)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 for(let i=0;i<45;i++)P.push({x,y,vx:(Math.random()-.5)*11,vy:-Math.random()*10-2,s:4+Math.random()*5,c:`hsl(${Math.random()*360},85%,60%)`,l:75});
 if(run1)return;run1=1;(function f(){cx.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l-->0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(p.x,p.y,p.s,p.s)});
  P.length?requestAnimationFrame(f):run1=0})()}
let mode="quiz",dir=0,streak=0,best=+ls.get("best")||0;
const rnd=a=>a[Math.random()*a.length|0];
function quiz(){
 const w=rnd(WORDS),k=dir?"en":"hy",q=dir?"hy":"en",pool=WORDS.filter(x=>x.c===w.c&&x.id!==w.id),o=[w];
 while(o.length<4&&pool.length)o.push(pool.splice(Math.random()*pool.length|0,1)[0]);
 o.sort(()=>Math.random()-.5);
 $("#learn").innerHTML=`<div class="stats"><div>🔥 Streak: ${streak}</div><span>Best: ${best}</span></div><div class="qcard"><small>${dir?"ARMENIAN → ENGLISH":"ENGLISH → ARMENIAN"}</small><div class="qw">${esc(w[q])}</div></div><div class="opts">${o.map(x=>`<button class="opt" data-o="${x.id}">${esc(x[k])}</button>`).join("")}</div>`;
 $$(".opt").forEach(b=>b.onclick=()=>{
  const ok=+b.dataset.o===w.id;$$(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===w.id)x.classList.add("good")});
  if(ok){streak++;if(streak>best){best=streak;ls.set("best",best)}boom(b)}else{b.classList.add("bad");streak=0}
  setTimeout(()=>mode==="quiz"&&view==="learn"&&quiz(),ok?900:1700)})}
function flash(){
 const w=rnd(WORDS);
 $("#learn").innerHTML=`<div class="flip" id="fl"><div class="face f1"><div class="qw">${esc(w.en)}</div><small>Tap to flip</small></div><div class="face f2"><div class="qw">${esc(w.hy)}</div></div></div><div class="cen"><div class="acts">${acts(w)}</div></div><button class="more" id="nx">Next word ➜</button>`;
 $("#fl").onclick=()=>$("#fl").classList.toggle("on");$("#nx").onclick=flash}
const learn=()=>mode==="quiz"?quiz():flash();
$("#lmode").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="dirb"){dir=1-dir;b.textContent=dir?"ՀՅ → EN":"EN → ՀՅ";streak=0}
 else{mode=b.dataset.m;$$("#lmode [data-m]").forEach(x=>x.classList.toggle("on",x===b))}
 learn()};
/* saved + tabs */
function renderSaved(){const r=WORDS.filter(w=>fav.has(w.id));$("#savedlist").innerHTML=r.length?r.map((w,i)=>card(w,"",i)).join(""):'<li class="empty">Tap ♥ on any word to save it here.</li>'}
function go(v){view=v;$$(".view").forEach(x=>x.hidden=x.id!=="v-"+v);$$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 if(v==="saved")renderSaved();if(v==="learn")learn();if(v==="body"&&!$(".z.sel"))pick("head");scrollTo({top:0})}
$("#tabs").onclick=e=>{const b=e.target.closest("button");b&&go(b.dataset.v)};
/* background: cells + DNA helix */
const bg=$("#bg"),bx=bg.getContext("2d");let W,H,col="#0d9488",t=0,fr=0;
const cells=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),r:8+Math.random()*24,v:.0024*(.5+Math.random())}));
function size(){W=bg.width=fx.width=innerWidth;H=bg.height=fx.height=innerHeight;col=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||col}
function tick(){
 if(fr++%120===0)col=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||col;
 bx.clearRect(0,0,W,H);bx.strokeStyle=bx.fillStyle=col;bx.lineWidth=2;bx.globalAlpha=.16;
 cells.forEach(c=>{if(!RM)c.y-=c.v/60;if(c.y<-.1)c.y=1.1;bx.beginPath();bx.arc(c.x*W,c.y*H,c.r,0,7);bx.stroke()});
 const x0=W-30;bx.globalAlpha=.3;
 for(let y=0;y<H;y+=12){const s=Math.sin(y/40+t),a=x0+s*20,b=x0-s*20;
  bx.beginPath();bx.arc(a,y,2.6,0,7);bx.fill();bx.beginPath();bx.arc(b,y,2.6,0,7);bx.fill();
  if(y%36===0){bx.lineWidth=1;bx.beginPath();bx.moveTo(a,y);bx.lineTo(b,y);bx.stroke()}}
 t+=.02;if(!RM)requestAnimationFrame(tick)}
size();tick();addEventListener("resize",()=>{size();RM&&tick()});
/* intro */
const intro=$("#intro");let done=false;
function finish(){if(done)return;done=true;intro.classList.add("out");$("#main").classList.add("show");document.body.classList.remove("lock");setTimeout(()=>intro.remove(),1100)}
intro.onclick=finish;setTimeout(finish,3800);
(function(){const T=WORDS.length,t0=performance.now(),el=$("#n");
 (function s(now){const p=Math.min((now-t0-600)/1700,1);el.textContent=p<1?Math.round(T*(p<0?0:1-Math.pow(1-p,3))):T;if(p<1&&!done)requestAnimationFrame(s);else el.textContent=T})(t0)})();
</script>
